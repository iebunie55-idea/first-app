<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>발표 순서 뽑기</title>
  <style>
    /* 밝은 색 기본값 */
    :root {
      --bg: #fffaf0;
      --card: #ffffff;
      --text: #222222;
      --main: #ff7a00;
      --main-dark: #d96500;
      --sub: #2f80ed;
      --done: #e4e4e4;
      --done-text: #9a9a9a;
      --line: #f0d9bf;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      font-size: clamp(18px, 2.2vw, 28px);
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    h1 {
      margin: 8px 0 0;
      text-align: center;
      font-size: clamp(32px, 5vw, 64px);
    }
    .setup {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }
    .setup label { font-weight: bold; }
    input {
      width: 5em;
      padding: 10px;
      font-size: 1.4em;
      text-align: center;
      border: 3px solid var(--line);
      border-radius: 12px;
    }
    button {
      min-height: 64px;
      padding: 12px 28px;
      font-size: 1.3em;
      font-weight: bold;
      font-family: inherit;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      color: #fff;
      background: var(--sub);
    }
    button:disabled { background: var(--done); color: var(--done-text); cursor: not-allowed; }
    button.draw { background: var(--main); font-size: 1.8em; padding: 16px 56px; }
    button.draw:not(:disabled):hover { background: var(--main-dark); }
    button.draw:disabled { background: var(--done); }
    button.reset { background: #fff; color: var(--sub); border: 3px solid var(--sub); }
    button.reset:disabled { border-color: var(--done); background: #fff; }
    .message { text-align: center; min-height: 1.5em; font-weight: bold; color: var(--main-dark); margin: 0; }
    .picked {
      background: var(--card);
      border: 4px solid var(--line);
      border-radius: 24px;
      text-align: center;
      padding: 8px;
    }
    .picked-label { margin: 8px 0 0; }
    .picked-number {
      font-size: clamp(120px, 22vw, 280px);
      font-weight: 900;
      line-height: 1.1;
      color: var(--main);
    }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 10px;
    }
    .list li {
      background: var(--card);
      border: 3px solid var(--sub);
      border-radius: 14px;
      text-align: center;
      padding: 8px 4px;
      font-size: 1.6em;
      font-weight: bold;
    }
    .list li.done { background: var(--done); border-color: var(--done); color: var(--done-text); }
    .list li small { display: block; font-size: 0.6em; font-weight: normal; }
  </style>
</head>
<body>
  <main>
    <h1>발표 순서 뽑기</h1>

    <div class="setup">
      <label for="count">인원수</label>
      <input id="count" type="number" inputmode="numeric" min="1" max="40" value="25">
      <button id="makeBtn" type="button">번호 만들기</button>
    </div>

    <p id="message" class="message" aria-live="polite"></p>

    <section class="picked">
      <p class="picked-label">뽑힌 번호</p>
      <div id="picked" class="picked-number" aria-live="assertive">?</div>
    </section>

    <div class="actions">
      <button id="drawBtn" class="draw" type="button" disabled>뽑기</button>
      <button id="resetBtn" class="reset" type="button" disabled>처음부터</button>
    </div>

    <ul id="list" class="list" aria-label="번호 목록"></ul>
  </main>

  <script>
    // 인원수 허용 범위
    const MIN_COUNT = 1;
    const MAX_COUNT = 40;

    // 앱 상태: 전체 인원수와 뽑힌 순서 (저장하지 않음)
    let state = { total: 0, drawn: [] };

    const $ = (id) => document.getElementById(id);

    // 아직 뽑히지 않은 번호 목록
    function remainingNumbers({ total, drawn }) {
      return Array.from({ length: total }, (_, i) => i + 1).filter((n) => !drawn.includes(n));
    }

    function render(message) {
      const { total, drawn } = state;
      const left = remainingNumbers(state);

      $("picked").textContent = drawn.length ? drawn[drawn.length - 1] : "?";
      $("drawBtn").disabled = total === 0 || left.length === 0;
      $("resetBtn").disabled = drawn.length === 0;

      if (message !== undefined) {
        $("message").textContent = message;
      } else if (total === 0) {
        $("message").textContent = "인원수를 넣고 [번호 만들기]를 눌러 주세요.";
      } else if (left.length === 0) {
        $("message").textContent = "모두 뽑았어요! [처음부터]를 누르면 다시 할 수 있어요.";
      } else {
        $("message").textContent = `남은 번호: ${left.length}개`;
      }

      // 번호 목록 다시 그리기
      $("list").replaceChildren(...Array.from({ length: total }, (_, i) => {
        const n = i + 1;
        const order = drawn.indexOf(n);
        const li = document.createElement("li");
        li.textContent = n;
        if (order >= 0) {
          li.className = "done";
          const small = document.createElement("small");
          small.textContent = `${order + 1}번째`;
          li.append(small);
        }
        return li;
      }));
    }

    function makeNumbers() {
      const value = Number($("count").value);
      if (!Number.isInteger(value) || value < MIN_COUNT || value > MAX_COUNT) {
        render(`인원수는 ${MIN_COUNT}부터 ${MAX_COUNT}까지 숫자로 넣어 주세요.`);
        return;
      }
      state = { total: value, drawn: [] };
      render();
    }

    function draw() {
      const left = remainingNumbers(state);
      if (left.length === 0) return;
      const pick = left[Math.floor(Math.random() * left.length)];
      state = { ...state, drawn: [...state.drawn, pick] };
      render();
    }

    function reset() {
      state = { ...state, drawn: [] };
      render();
    }

    $("makeBtn").addEventListener("click", makeNumbers);
    $("count").addEventListener("keydown", (e) => { if (e.key === "Enter") makeNumbers(); });
    $("drawBtn").addEventListener("click", draw);
    $("resetBtn").addEventListener("click", reset);

    render();
  </script>
</body>
</html>
